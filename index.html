  <style>
    :root {
      --primary: #e91e8c;
      --primary-light: #f06292;
      --primary-dark: #c2185b;
      --bg: #0d0d0d;
      --bg2: #111117;
      --surface: rgba(255,255,255,0.05);
      --surface2: rgba(255,255,255,0.08);
      --text: #f0f0f0;
      --text-muted: #aaa;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.15);
      --glow: rgba(233,30,140,0.3);
      --glow2: rgba(233,30,140,0.5);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);

      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;

    /* Skip link */
    .skip-link {
      position: absolute; top: -40px; left: 0;
      background: var(--primary); color: #fff;
      padding: 8px 16px; text-decoration: none;
      z-index: 10000; border-radius: 0 0 4px 0;
      transition: top 0.2s;
    }
    .skip-link:focus { top: 0; }

    /* App loader */
    #app-loader {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.4s;
    }
    .loader-heart { font-size: 56px; animation: pulse 0.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.25)} }

    /* Layout */
    .container { width: 100%; max-width: 640px; padding: 20px; }

    header {
      text-align: center;
      padding: 40px 20px 16px;
      width: 100%;
      max-width: 640px;
    }
    .app-title {
      font-size: clamp(24px, 6vw, 38px);
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .app-subtitle { color: var(--text-muted); font-size: 15px; }

    /* Language selector */
    .lang-selector { position: fixed; top: 12px; right: 12px; z-index: 1000; }
    .lang-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 7px 13px; border-radius: 20px;
      cursor: pointer; font-size: 13px; backdrop-filter: blur(12px);
      transition: border-color 0.2s;
    }
    .lang-btn:hover { border-color: var(--primary); }
    .lang-dropdown {
      display: none; position: absolute; right: 0; top: 40px;
      background: rgba(18,18,24,0.97); border: 1px solid var(--border);
      border-radius: 14px; padding: 8px; min-width: 150px;

    .lang-dropdown.open { display: block; }
    .lang-option {

    .intro-card-name { font-size: 13px; font-weight: 700; margin-bottom: 4px; color: var(--text); }

    .start-btn {

    /* Result screen */
    #result-screen { display: none; }
    #result-screen.active { display: block; }

    .result-hero {

    .result-title { font-size: 28px; font-weight: 900; color: #fff; margin-bottom: 6px; position: relative; }
    .result-subtitle { font-size: 14px; color: rgba(255,255,255,0.8); position: relative; }

    /* Score bars */
    .score-bars { margin: 20px 0; }
    .score-item { margin-bottom: 18px; }
    .score-label {
      display: flex; justify-content: space-between; margin-bottom: 7px;

    }

    .score-bar-bg { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
    .score-bar-fill {
      height: 100%; border-radius: 5px; transition: width 0.9s cubic-bezier(0.4,0,0.2,1);

    .result-desc {

    /* Compatibility */
    .compat-section { margin: 20px 0; }
    .section-title {
      font-size: 17px; font-weight: 700; margin-bottom: 12px;
      color: var(--text);
    }
    .compat-item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px 18px; margin-bottom: 10px;
      display: flex; gap: 12px; align-items: center;
      font-weight: 600; font-size: 15px;
      transition: border-color 0.2s;
    }
    .compat-item:hover { border-color: var(--primary); }

    /* Share section */
    .share-section { text-align: center; margin: 24px 0 16px; }
    .share-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; color: var(--text-muted); }
    .share-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .share-btn {
      padding: 12px 22px; border-radius: 12px; border: none;
      cursor: pointer; font-size: 14px; font-weight: 700;
      transition: all 0.2s; min-height: 44px;
    }
    .share-btn:hover { transform: translateY(-2px); opacity: 0.9; }
    .share-copy {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text);
    }
    .share-twitter { background: #1a1a1a; color: #fff; border: 1px solid #333; }

    .retry-btn {
      display: block; width: 100%; padding: 18px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff; border: none; border-radius: 16px;
      cursor: pointer; font-size: 16px; font-weight: 800;
      margin-top: 16px; min-height: 52px;
      transition: all 0.2s; box-shadow: 0 4px 20px var(--glow);
    }
    .retry-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px var(--glow2); }

    /* Cross promo */
    .cross-promo-section { width: 100%; margin: 20px 0; }

    footer {
      text-align: center; padding: 24px 20px;
      color: var(--text-muted); font-size: 13px;
      width: 100%; max-width: 640px;
    }
    footer a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
    footer a:hover { color: var(--primary); }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeInUp 0.4s ease; }

    /* Accessibility */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Responsive */
    @media (max-width: 480px) {
      .intro-cards { grid-template-columns: 1fr; }
      .nav-btns { flex-direction: column; }
      .question-card { padding: 22px 16px; }
      header { padding: 28px 16px 12px; }
    }
  </style>
</head>

<script>
// ============================================================
// QUESTIONS DATA (30 pairs)
// al = love language for option A, bl = for option B
// W=Words, A=Acts, G=Gifts, T=Time, P=Physical
// ============================================================
const QUESTIONS = [
  {q:'q1',  a:'q1a',  b:'q1b',  al:'W', bl:'A'},
  {q:'q2',  a:'q2a',  b:'q2b',  al:'W', bl:'A'},
  {q:'q3',  a:'q3a',  b:'q3b',  al:'W', bl:'A'},
  {q:'q4',  a:'q4a',  b:'q4b',  al:'W', bl:'A'},
  {q:'q5',  a:'q5a',  b:'q5b',  al:'W', bl:'A'},
  {q:'q6',  a:'q6a',  b:'q6b',  al:'W', bl:'A'},
  {q:'q7',  a:'q7a',  b:'q7b',  al:'W', bl:'G'},
  {q:'q8',  a:'q8a',  b:'q8b',  al:'W', bl:'G'},
  {q:'q9',  a:'q9a',  b:'q9b',  al:'W', bl:'T'},
  {q:'q10', a:'q10a', b:'q10b', al:'W', bl:'T'},
  {q:'q11', a:'q11a', b:'q11b', al:'W', bl:'P'},
  {q:'q12', a:'q12a', b:'q12b', al:'W', bl:'P'},
  {q:'q13', a:'q13a', b:'q13b', al:'A', bl:'G'},
  {q:'q14', a:'q14a', b:'q14b', al:'A', bl:'G'},
  {q:'q15', a:'q15a', b:'q15b', al:'A', bl:'T'},
  {q:'q16', a:'q16a', b:'q16b', al:'A', bl:'T'},
  {q:'q17', a:'q17a', b:'q17b', al:'A', bl:'P'},
  {q:'q18', a:'q18a', b:'q18b', al:'A', bl:'P'},
  {q:'q19', a:'q19a', b:'q19b', al:'G', bl:'T'},
  {q:'q20', a:'q20a', b:'q20b', al:'G', bl:'T'},
  {q:'q21', a:'q21a', b:'q21b', al:'G', bl:'P'},
  {q:'q22', a:'q22a', b:'q22b', al:'G', bl:'P'},
  {q:'q23', a:'q23a', b:'q23b', al:'T', bl:'P'},
  {q:'q24', a:'q24a', b:'q24b', al:'T', bl:'P'},
  {q:'q25', a:'q25a', b:'q25b', al:'W', bl:'T'},
  {q:'q26', a:'q26a', b:'q26b', al:'A', bl:'P'},
  {q:'q27', a:'q27a', b:'q27b', al:'W', bl:'G'},
  {q:'q28', a:'q28a', b:'q28b', al:'A', bl:'T'},
  {q:'q29', a:'q29a', b:'q29b', al:'P', bl:'G'},
  {q:'q30', a:'q30a', b:'q30b', al:'W', bl:'P'},
];

const LANG_INFO = {
  W: {icon:'💬', key:'lang.words'},
  A: {icon:'🛠️', key:'lang.acts'},
  G: {icon:'🎁', key:'lang.gifts'},
  T: {icon:'⏰', key:'lang.time'},
  P: {icon:'🤗', key:'lang.touch'},
};

const COMPAT = {
  W: ['W','T'], A: ['A','T'], G: ['G','W'], T: ['T','W'], P: ['P','A']
};

let currentQ = 0;
let answers = new Array(30).fill(null);
let selectedChoice = null;

function t(key) {
  return (window.i18n && window.i18n.t(key) !== key) ? window.i18n.t(key) : key;
}

function showQuestion(idx) {
  const q = QUESTIONS[idx];
  document.getElementById('qNumber').textContent = 'Q ' + (idx + 1);
  document.getElementById('currentQ').textContent = idx + 1;
  document.getElementById('qText').textContent = t(q.q);
  document.getElementById('choiceAText').textContent = t(q.a);
  document.getElementById('choiceBText').textContent = t(q.b);
  document.getElementById('progressBar').style.width = (idx / QUESTIONS.length * 100) + '%';

  selectedChoice = answers[idx];
  updateChoiceUI();
  document.getElementById('nextBtn').disabled = selectedChoice === null;
  document.getElementById('prevBtn').disabled = idx === 0;
}

function updateChoiceUI() {
  const btnA = document.getElementById('choiceA');
  const btnB = document.getElementById('choiceB');
  btnA.classList.toggle('selected', selectedChoice === 'A');
  btnB.classList.toggle('selected', selectedChoice === 'B');
  btnA.setAttribute('aria-pressed', selectedChoice === 'A');
  btnB.setAttribute('aria-pressed', selectedChoice === 'B');
}

function selectChoice(c) {
  selectedChoice = c;
  answers[currentQ] = c;
  updateChoiceUI();
  document.getElementById('nextBtn').disabled = false;
  setTimeout(() => {
    if (currentQ < QUESTIONS.length - 1) nextQuestion();
    else showResult();
  }, 320);
}

function nextQuestion() {
  if (selectedChoice === null) return;
  if (currentQ < QUESTIONS.length - 1) {
    currentQ++;
    showQuestion(currentQ);
  } else {
    showResult();
  }
}

function prevQuestion() {
  if (currentQ > 0) {
    currentQ--;
    showQuestion(currentQ);
  }
}

function calculateScores() {
  const scores = {W:0, A:0, G:0, T:0, P:0};
  QUESTIONS.forEach((q, i) => {
    const ans = answers[i];
    if (ans === 'A') scores[q.al]++;
    else if (ans === 'B') scores[q.bl]++;
  });
  return scores;
}

function showResult() {
  const scores = calculateScores();
  const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
  const primary = sorted[0][0];
  const total = Object.values(scores).reduce((a,b) => a + b, 0);

  const info = LANG_INFO[primary];
  document.getElementById('resultIcon').textContent = info.icon;
  document.getElementById('resultTitle').textContent = t(info.key);
  document.getElementById('resultSubtitle').textContent = t('result.primaryLabel') + ' ' + t(info.key);

  // Score bars
  const barHTML = sorted.map(([lang, score], i) => {
    const pct = total > 0 ? Math.round(score / total * 100) : 0;
    const li = LANG_INFO[lang];
    const fillClass = i === 0 ? 'score-bar-fill' : 'score-bar-fill secondary';
    return `<div class="score-item">
      <div class="score-label">
        <span class="score-label-left">${li.icon} ${t(li.key)}</span>
        <span>${pct}%</span>
      </div>
      <div class="score-bar-bg">
        <div class="${fillClass}" style="width:0%" data-width="${pct}%"></div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('scoreBars').innerHTML = barHTML;

  setTimeout(() => {
    document.querySelectorAll('.score-bar-fill').forEach(el => {
      el.style.width = el.dataset.width;
    });
  }, 120);

  document.getElementById('resultDesc').innerHTML =
    `<strong>${t(info.key)}</strong><br><br>${t('desc.' + primary)}`;
  document.getElementById('resultAdvice').innerHTML =
    `<strong>💡 ${t('result.adviceTitle')}</strong><br><br>${t('advice.' + primary)}`;

  const compatKeys = COMPAT[primary];
  document.getElementById('compatList').innerHTML = compatKeys.map(k => {
    const ci = LANG_INFO[k];
    return `<div class="compat-item">${ci.icon} <span>${t(ci.key)}</span></div>`;
  }).join('');

  document.getElementById('quiz-screen').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.classList.add('active');
  rs.classList.add('fade-in');
  document.getElementById('progressBar').style.width = '100%';

  if (typeof gtag !== 'undefined') {
    gtag('event', 'test_complete', {
      event_category: 'love_language',
      primary_language: primary
    });
  }
}

function retryTest() {
  currentQ = 0;
  answers = new Array(30).fill(null);
  selectedChoice = null;
  document.getElementById('result-screen').classList.remove('active', 'fade-in');
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('intro-screen').style.display = 'block';
  document.getElementById('progressBar').style.width = '0%';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function copyLink() {
  const url = window.location.href;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => {
      alert(t('share.copied'));
    }).catch(() => { prompt('Copy:', url); });
  } else {
    prompt('Copy:', url);
  }
}

function shareTwitter() {
  const url = encodeURIComponent(window.location.href);
  const text = encodeURIComponent(t('share.twitterText'));
  window.open('https://twitter.com/intent/tweet?url=' + url + '&text=' + text, '_blank', 'noopener');
}

// Start button
document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('intro-screen').style.display = 'none';
  const qs = document.getElementById('quiz-screen');
  qs.style.display = 'block';
  qs.classList.add('fade-in');
  showQuestion(0);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// Language selector
document.getElementById('langBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('langDropdown').classList.toggle('open');
});
document.querySelectorAll('.lang-option').forEach(btn => {
  btn.addEventListener('click', async () => {
    const lang = btn.dataset.lang;
    if (window.i18n) {
      await window.i18n.setLang(lang);
      const label = btn.textContent.trim().split(' ');
      document.getElementById('currentLang').textContent = label.slice(1).join(' ') || label[0];
    }
    document.getElementById('langDropdown').classList.remove('open');
    if (document.getElementById('quiz-screen').style.display !== 'none') {
      showQuestion(currentQ);
    }
  });
});
document.addEventListener('click', () => {
  document.getElementById('langDropdown').classList.remove('open');
});

// App loader
window.addEventListener('load', () => {
  setTimeout(() => {
    const loader = document.getElementById('app-loader');
    if (loader) {
      loader.style.opacity = '0';
      setTimeout(() => loader.remove(), 400);
    }
  }, 500);
});
</script>
<script src="/portal/js/cross-promo.js" defer></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
